name: Run E2E tests
description: Run the DevSpace E2E pipeline with tag selection.
inputs:
  service:
    description: Service name to translate into svc_<service> tag.
    required: false
  tag:
    description: Additional tags (comma-separated or repeated by callers).
    required: false
  include_smoke:
    description: When tags are provided, append the smoke tag.
    required: false
    default: "true"
  agn-binary:
    description: Optional path to an agn CLI binary in the caller workspace.
    required: false
  provider-binary:
    description: Optional path to a Terraform provider binary in the caller workspace.
    required: false
  e2e-ref:
    description: Ref of agynio/e2e to checkout for suite files.
    required: false
    default: main
runs:
  using: composite
  steps:
    - name: Checkout e2e repository
      uses: actions/checkout@v4
      with:
        repository: agynio/e2e
        ref: ${{ inputs.e2e-ref }}
        path: e2e

    - name: Stage provider binary
      if: ${{ inputs.provider-binary != '' }}
      shell: bash
      run: |
        set -euo pipefail
        source_path="$GITHUB_WORKSPACE/${{ inputs.provider-binary }}"
        if [ ! -f "$source_path" ]; then
          echo "Provider binary not found at $source_path" >&2
          exit 1
        fi
        dest_dir="$GITHUB_WORKSPACE/e2e/suites/go-terraform/.provider"
        mkdir -p "$dest_dir"
        cp "$source_path" "$dest_dir/terraform-provider-agyn"
        chmod +x "$dest_dir/terraform-provider-agyn"

    - name: Stage agn binary
      if: ${{ inputs.agn-binary != '' }}
      shell: bash
      run: |
        set -euo pipefail
        source_path="$GITHUB_WORKSPACE/${{ inputs.agn-binary }}"
        if [ ! -f "$source_path" ]; then
          echo "Agn binary not found at $source_path" >&2
          exit 1
        fi
        dest_dir="$GITHUB_WORKSPACE/e2e/suites/go-agn-cli/bin"
        mkdir -p "$dest_dir"
        cp "$source_path" "$dest_dir/agn"
        chmod +x "$dest_dir/agn"

    - name: Install PyYAML
      shell: bash
      run: |
        set -euo pipefail
        if python3 - <<'PY'
        import yaml
        PY
        then
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          else
            apt-get update
            apt-get install -y python3-yaml
          fi
        else
          python3 -m pip install --user --break-system-packages pyyaml
        fi

    - name: Setup DevSpace
      uses: ./e2e/.github/actions/setup-devspace

    - name: Export Agyn test env
      shell: bash
      run: |
        set -euo pipefail

        # Newest published release of a ghcr.io/agynio image, by semver.
        # tags/list is paginated and unordered, so every page is walked and the
        # tags are compared numerically — taking the last page's last entry
        # yields a stale version that looks plausible.
        latest_image() {
          local repo="$1" token url tags page next
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:agynio/${repo}:pull" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          url="https://ghcr.io/v2/agynio/${repo}/tags/list?n=1000"
          tags=""
          while [ -n "$url" ]; do
            page="$(curl -fsS -D /tmp/hdr.$$ -H "Authorization: Bearer ${token}" "$url")"
            tags="${tags}$(printf '%s' "$page" |
              python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin).get("tags") or []))')
        "
            next="$(sed -n 's/^[Ll]ink:.*<\([^>]*\)>.*/\1/p' /tmp/hdr.$$)"
            rm -f /tmp/hdr.$$
            [ -n "$next" ] && url="https://ghcr.io${next}" || url=""
          done
          # grep exits non-zero on no match, which pipefail would turn into an
          # abort before the empty check below reports something useful.
          local latest
          latest="$(printf '%s\n' "$tags" | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -z "$latest" ]; then
            echo "No semver tags found for ghcr.io/agynio/${repo}." >&2
            return 1
          fi
          printf 'ghcr.io/agynio/%s:%s' "$repo" "$latest"
        }

        # The cluster is described entirely by the environment the provisioning
        # step exported. Nothing here knows how it was provisioned, which is what
        # let the k3d-and-Terraform stack be swapped for the platform VM without
        # touching a suite.
        for required in AGYN_API_TOKEN AGYN_ORGANIZATION_ID; do
          if [ -z "${!required:-}" ]; then
            echo "${required} is not set; run a provisioning action before this one." >&2
            exit 1
          fi
        done

        # AGYN_BASE_URL is optional, and usually absent: the suites run in pods,
        # where the pipeline's in-cluster address is the only one that resolves.
        # A caller that sets it is naming a URL reachable from inside the
        # cluster, so it is worth failing early if it is not reachable at all.
        if [ -n "${AGYN_BASE_URL:-}" ]; then
          gateway_status=$(curl -sS -k -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "${AGYN_BASE_URL}" || true)
          if [ -z "$gateway_status" ] || [ "$gateway_status" = "000" ]; then
            echo "AGYN_BASE_URL ${AGYN_BASE_URL} is not reachable." >&2
            exit 1
          fi
        fi

        if [ -z "${AGYN_AGENT_IMAGE:-}" ]; then
          AGYN_AGENT_IMAGE="ghcr.io/agynio/agent-runtime:v1.0.0"
          echo "AGYN_AGENT_IMAGE=$AGYN_AGENT_IMAGE" >> "$GITHUB_ENV"
        fi

        # Init images are always resolved to the newest published release, never
        # pinned. A pin here is invisible to the caller and silently opts every
        # run out of fixes shipped in later init images — which is how a known
        # agent-reply flake kept reproducing in a service whose workflow pinned
        # a version predating its fix. Resolution failure is fatal: falling back
        # to some hardcoded tag is the behaviour this replaces.
        codex_init_image="$(latest_image agyn-runtime-codex)"
        agn_init_image="$(latest_image agyn-runtime-agn)"
        claude_init_image="$(latest_image agyn-runtime-claude)"

        # No agynio/agent-runtime image is published; the codex runtime stands in.
        {
          echo "CODEX_INIT_IMAGE=$codex_init_image"
          echo "AGYN_AGENT_INIT_IMAGE=$codex_init_image"
          echo "AGN_INIT_IMAGE=$agn_init_image"
          echo "AGN_EXPOSE_INIT_IMAGE=$agn_init_image"
          echo "CLAUDE_INIT_IMAGE=$claude_init_image"
        } >> "$GITHUB_ENV"

        echo "init images: codex=$codex_init_image agn=$agn_init_image claude=$claude_init_image"

    - name: Run DevSpace E2E pipeline
      id: run
      shell: bash
      run: |
        set -euo pipefail
        tags=()
        if [ -n "${{ inputs.service }}" ]; then
          tags+=("svc_${{ inputs.service }}")
        fi
        if [ -n "${{ inputs.tag }}" ]; then
          IFS=',' read -r -a extra_tags <<< "${{ inputs.tag }}"
          for tag in "${extra_tags[@]}"; do
            trimmed=$(echo "$tag" | xargs)
            if [ -n "$trimmed" ]; then
              tags+=("$trimmed")
            fi
          done
        fi

        unique_tags=()
        declare -A seen=()
        for tag in "${tags[@]}"; do
          if [ -z "${seen[$tag]+x}" ]; then
            unique_tags+=("$tag")
            seen[$tag]=1
          fi
        done

        include_smoke="${{ inputs.include_smoke }}"
        if [ -z "$include_smoke" ]; then
          include_smoke="true"
        fi
        include_smoke=$(echo "$include_smoke" | tr '[:upper:]' '[:lower:]')

        namespace="${DEVSPACE_NAMESPACE:-agyn-platform}"
        cd "$GITHUB_WORKSPACE/e2e"

        export DEVSPACE_NAMESPACE="$namespace"

        if [ -n "${{ inputs.provider-binary }}" ]; then
          export PROVIDER_BINARY="$GITHUB_WORKSPACE/e2e/suites/go-terraform/.provider/terraform-provider-agyn"
        fi

        set +e
        if [ "${#unique_tags[@]}" -eq 0 ]; then
          devspace run test-e2e
          exit_code=$?
        else
          if [ "$include_smoke" = "true" ]; then
            unique_tags+=("smoke")
          fi
          declare -A seen_run=()
          tag_args=()
          for tag in "${unique_tags[@]}"; do
            if [ -z "${seen_run[$tag]+x}" ]; then
              tag_args+=("--tag" "$tag")
              seen_run[$tag]=1
            fi
          done
          devspace run test-e2e "${tag_args[@]}"
          exit_code=$?
        fi
        set -e

        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Capture diagnostics
      if: ${{ steps.run.outputs.exit_code != '0' }}
      shell: bash
      run: |
        set -euo pipefail
        namespace="${DEVSPACE_NAMESPACE:-agyn-platform}"
        diagnostics_dir="$GITHUB_WORKSPACE/e2e/.diagnostics"
        mkdir -p "$diagnostics_dir/logs"
        kubectl get pods -n "$namespace" -o wide > "$diagnostics_dir/pods-all.txt" || true
        kubectl get pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e -o wide > "$diagnostics_dir/pods.txt" || true
        kubectl describe pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e > "$diagnostics_dir/describe-pods.txt" || true
        kubectl get events -n "$namespace" --sort-by=.metadata.creationTimestamp > "$diagnostics_dir/events.txt" || true
        pods=$(kubectl get pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e -o name 2>/dev/null || true)
        for pod in $pods; do
          pod_name=$(echo "$pod" | sed 's|pod/||')
          kubectl logs -n "$namespace" --all-containers --prefix "$pod" > "$diagnostics_dir/logs/${pod_name}.log" 2>&1 || true
        done

        # The platform's own pods, not just the test pods. A suite that reports
        # nothing more than "expected 1 workload, got 0" leaves the reason in
        # whichever service declined to act -- and with the service under test
        # running from source, that reason is exactly what a caller needs.
        for pod in $(kubectl get pods -n "$namespace" \
          -l '!app.kubernetes.io/managed-by' -o name 2>/dev/null || true); do
          pod_name=$(echo "$pod" | sed 's|pod/||')
          kubectl logs -n "$namespace" --all-containers --prefix --tail=500 "$pod" \
            > "$diagnostics_dir/logs/platform-${pod_name}.log" 2>&1 || true
        done
        kubectl get pods -n agyn-workloads -o wide > "$diagnostics_dir/workload-pods.txt" 2>&1 || true
        for pod in $(kubectl get pods -n agyn-workloads -o name 2>/dev/null || true); do
          pod_name=$(echo "$pod" | sed 's|pod/||')
          kubectl logs -n agyn-workloads --all-containers --prefix --tail=500 "$pod" \
            > "$diagnostics_dir/logs/workload-${pod_name}.log" 2>&1 || true
        done

    - name: Upload test artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        # Distinct per caller. Only `service` used to vary it, so a workflow
        # selecting by `tag` -- several jobs of one workflow, which is how this
        # repo runs its own suites -- had every job upload under the same name
        # and keep one set of results between them.
        name: e2e-artifacts-${{ inputs.service != '' && inputs.service || github.job }}-${{ strategy.job-index || '0' }}
        path: |
          e2e/.artifacts/
          e2e/.diagnostics/
        include-hidden-files: true
        if-no-files-found: warn

    - name: Fail if tests failed
      if: ${{ steps.run.outputs.exit_code != '0' }}
      shell: bash
      run: exit 1
