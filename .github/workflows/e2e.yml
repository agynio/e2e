name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: ./.github/actions/provision-vm

      - name: Run platform usage E2E test
        uses: ./.github/actions/run-tests
        env:
          E2E_SUITES: playwright
          E2E_PLAYWRIGHT_TEST_ARGS: test/e2e/organization-platform-usage.spec.ts
        with:
          tag: svc_metering
          include_smoke: false
