image: ghcr.io/agynio/e2e/playwright:v1.59.1-noble
workdir: /opt/app/data
select: |
  suite_tags=("svc_console" "svc_gateway" "svc_threads" "svc_metering" "svc_identity" "smoke")

  if [ -z "${TAGS:-}" ]; then
    echo "playwright"
    exit 0
  fi

  for tag in ${TAGS}; do
    for suite_tag in "${suite_tags[@]}"; do
      if [ "$tag" = "$suite_tag" ]; then
        echo "$tag"
        exit 0
      fi
    done
  done
run: |
  set -euo pipefail
  cd /opt/app/data

  export E2E_DOMAIN="${E2E_DOMAIN:-agyn.dev}"
  # The ingress publishes the host port inside the cluster too, and that is
  # the origin Dex is configured with. On 443 the app is the same but the
  # origin is not, and the discovery fetch fails CORS before any sign-in.
  e2e_port="${E2E_INGRESS_PORT:-}"
  if [ -n "${e2e_port}" ] && [ "${e2e_port}" != "443" ]; then
    export E2E_BASE_URL="${E2E_BASE_URL:-https://console.${E2E_DOMAIN}:${e2e_port}}"
  else
    export E2E_BASE_URL="${E2E_BASE_URL:-https://console.${E2E_DOMAIN}}"
  fi

  npm ci --no-fund --no-audit
  npx buf generate

  grep_tags=""
  if [ -n "${TAGS:-}" ]; then
    for tag in ${TAGS}; do
      if [ -n "$grep_tags" ]; then
        grep_tags="${grep_tags}|"
      fi
      grep_tags="${grep_tags}@${tag}"
    done
  fi

  set +e
  test_args=()
  if [ -n "${E2E_PLAYWRIGHT_TEST_ARGS:-}" ]; then
    read -r -a test_args <<< "${E2E_PLAYWRIGHT_TEST_ARGS}"
  fi

  if [ -n "$grep_tags" ]; then
    CI=true npx playwright test "${test_args[@]}" --grep "$grep_tags"
  else
    CI=true npx playwright test "${test_args[@]}"
  fi
  status=$?
  set -e

  if [ ! -f junit.xml ]; then
    echo "ERROR: junit.xml not created" >&2
    exit 1
  fi

  exit "$status"
