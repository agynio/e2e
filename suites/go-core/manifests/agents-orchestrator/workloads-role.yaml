apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-orchestrator-e2e-workloads
  namespace: agyn-workloads
  labels:
    app.kubernetes.io/component: e2e-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # The egress wiring assertion reads the policy that confines a workload's
  # egress, and it lives in this namespace beside the workloads it selects.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
