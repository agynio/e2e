image: ghcr.io/agynio/e2e/playwright:v1.59.1-noble
workdir: /opt/app/data
required_env:
  - AGN_INIT_IMAGE
  - CODEX_INIT_IMAGE
  - CLAUDE_INIT_IMAGE
select: |
  suite_tags=("svc_tracing_app" "svc_agents_orchestrator" "smoke")

  if [ -z "${TAGS:-}" ]; then
    echo "smoke"
    exit 0
  fi

  for tag in ${TAGS}; do
    for suite_tag in "${suite_tags[@]}"; do
      if [ "$tag" = "$suite_tag" ]; then
        echo "$tag"
        exit 0
      fi
    done
  done
run: |
  set -euo pipefail
  cd /opt/app/data

  npm ci --no-fund --no-audit
  npx buf generate
  # TRACING_URL as the release publishes it, from the ConfigMap the apps read.
  #
  # Composed only while it is empty. platform.externalUrls carries these
  # addresses and the bundle has to set them -- it owns its own ingress, so
  # there are no routes to derive them from, and they carry a port no
  # derivation would produce. The image CI boots predates that, so until it
  # is republished the port has to come from somewhere; E2E_INGRESS_PORT is
  # what the provisioner exports. Delete this branch once the ConfigMap
  # arrives populated.
  export E2E_BASE_URL="${E2E_BASE_URL:-${TRACING_URL:-}}"
  if [ -z "${E2E_BASE_URL}" ]; then
    e2e_port="${E2E_INGRESS_PORT:-}"
    if [ -n "${e2e_port}" ] && [ "${e2e_port}" != "443" ]; then
      export E2E_BASE_URL="https://tracing.agyn.dev:${e2e_port}"
    else
      export E2E_BASE_URL="https://tracing.agyn.dev"
    fi
  fi
  echo "tracing base url: ${E2E_BASE_URL}"

  grep_tags=""
  if [ -n "${TAGS:-}" ]; then
    for tag in ${TAGS}; do
      if [ -n "$grep_tags" ]; then
        grep_tags="${grep_tags}|"
      fi
      grep_tags="${grep_tags}@${tag}"
    done
  else
    grep_tags="@smoke"
  fi

  set +e
  if [ -n "$grep_tags" ]; then
    CI=true npx playwright test --grep "$grep_tags"
  else
    CI=true npx playwright test
  fi
  status=$?
  set -e

  if [ ! -f junit.xml ]; then
    echo "ERROR: junit.xml not created" >&2
    exit 1
  fi

  exit "$status"
