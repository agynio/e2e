image: ghcr.io/agynio/e2e/playwright:v1.59.1-noble
workdir: /opt/app/data
required_env:
  - CODEX_INIT_IMAGE
select: |
  suite_tags=("svc_chat_app" "svc_gateway" "svc_agents_orchestrator" "svc_organizations" "svc_files" "svc_media_proxy" "svc_tracing_app")

  if [ -z "${TAGS:-}" ]; then
    exit 0
  fi

  for tag in ${TAGS}; do
    for suite_tag in "${suite_tags[@]}"; do
      if [ "$tag" = "$suite_tag" ]; then
        echo "$tag"
        exit 0
      fi
    done
  done
run: |
  set -euo pipefail
  cd /opt/app/data

  # CHAT_URL, from the ConfigMap the release publishes and the apps themselves
  # read. Composing this from a domain and a port invented an address: it
  # missed the ingress port the platform is configured for, and it cannot
  # know a host the install renamed.
  export E2E_BASE_URL="${E2E_BASE_URL:-${CHAT_URL:-}}"
  if [ -z "${E2E_BASE_URL}" ]; then
    echo "no CHAT_URL: the release publishes it in agyn-platform-app-urls, which this pod reads" >&2
    exit 1
  fi

  npm ci --no-fund --no-audit
  npx buf generate

  grep_tags=""
  if [ -n "${TAGS:-}" ]; then
    for tag in ${TAGS}; do
      if [ -n "$grep_tags" ]; then
        grep_tags="${grep_tags}|"
      fi
      grep_tags="${grep_tags}@${tag}"
    done
  fi

  set +e
  if [ -n "$grep_tags" ]; then
    CI=true npx playwright test --grep "$grep_tags"
  else
    CI=true npx playwright test
  fi
  status=$?
  set -e

  if [ ! -f junit.xml ]; then
    echo "ERROR: junit.xml not created" >&2
    exit 1
  fi

  exit "$status"
